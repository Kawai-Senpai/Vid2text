name: Windows release

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install locked build dependencies
        run: |
          python -m pip install uv
          uv sync --locked --group build
      - name: Build and smoke-test Vid2text
        run: |
          uv run --no-sync pyinstaller --noconfirm Vid2text.spec
          $exe = (Resolve-Path dist/Vid2text/Vid2text.exe).Path
          $smoke = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $smoke.WaitForExit(90000)) {
            $smoke.Kill()
            throw 'Vid2text smoke test timed out.'
          }
          if ($smoke.ExitCode -ne 0) { throw "Vid2text smoke test failed ($($smoke.ExitCode))." }
      - name: Archive release and calculate checksum
        id: archive
        run: |
          Copy-Item README.md dist/Vid2text
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $zip = "Vid2text-$version-windows-x64.zip"
          Compress-Archive -Path dist/Vid2text -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Upload Windows build
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Vid2text-windows-x64
          path: |
            ${{ steps.archive.outputs.zip }}
            ${{ steps.archive.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.archive.outputs.zip }}
        run: |
          $zip = $env:RELEASE_ZIP
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes
