[project]
name = "vid2text"
version = "0.1.0"
description = "Local desktop audio and video transcription"
requires-python = ">=3.12,<3.13"
dependencies = ["faster-whisper>=1.2.1,<2", "ctranslate2>=4.6,<5", "psutil>=6,<9", "sherpa-onnx>=2.0.1,<3"]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12>=12,<13", "nvidia-cudnn-cu12>=9,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
[dependency-groups]
build = ["pyinstaller>=6.20,<7"]
